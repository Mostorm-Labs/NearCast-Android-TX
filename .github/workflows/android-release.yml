name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  MOSAPI_FOLDER_ID: "546"
  MOSAPI_PRODUCT_ID: "627"
  MOSAPI_PRODUCT_SLUG: nearcast-tx-android

jobs:
  build:
    name: Build and Upload Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from version.properties
        id: get_version
        run: |
          VERSION_NAME=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
          TAG_NAME="${{ github.ref_name }}"
          # Use tag name if it starts with 'v', otherwise use version.properties
          if [[ "$TAG_NAME" =~ ^v[0-9] ]]; then
            PUBLISH_VERSION="${TAG_NAME#v}"
          else
            PUBLISH_VERSION="$VERSION_NAME"
          fi
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=$PUBLISH_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_name=$PUBLISH_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Using version: $PUBLISH_VERSION"

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.ENCODED_KEYSTORE != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Verify release keystore certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: "52:B6:8A:31:8B:21:6B:D9:36:A7:D7:AC:D9:D3:90:53:D8:12:26:02:8B:45:82:53:69:E2:D1:1F:9F:D2:26:78"
        run: |
          set -euo pipefail
          if [[ ! -s release.jks ]]; then
            echo "Decoded release keystore is missing or empty."
            exit 1
          fi
          actual_cert_sha256=$(keytool -list -v \
            -keystore release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}')
          echo "Release certificate SHA-256: $actual_cert_sha256"
          if [[ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "The CI keystore does not match the expected awx.jks certificate."
            exit 1
          fi
          echo "CI keystore matches awx.jks."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew -PversionNameOverride=${{ steps.get_version.outputs.version_name }} -PversionCodeOverride=${{ steps.get_version.outputs.version_code }} assembleRelease

      - name: Locate versioned release APK
        id: locate_apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'NearCast-Android-TX-v*.apk' | sort | tail -n 1)
          if [[ -z "$APK_PATH" ]]; then
            echo "No versioned release APK found."
            ls -lah app/build/outputs/apk/release || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Generate Mosapi changelog
        id: generate_changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          current_tag="${{ github.ref_name }}"
          # If triggered by workflow_dispatch and no ref_name tag, use HEAD
          if [[ -z "$current_tag" || ! "$current_tag" =~ ^v ]]; then
            current_tag="HEAD"
          fi
          
          # Find the previous tag for changelog generation
          previous_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || echo "")

          changelog_path="mosapi-changelog.md"
          if [[ -n "$previous_tag" ]]; then
            echo "Generating changelog from $previous_tag..$current_tag"
            git log --no-merges --pretty=format:'- %s (%h)' "$previous_tag..$current_tag" > "$changelog_path"
          else
            echo "No previous tag found; generating changelog for $current_tag"
            git log --no-merges --pretty=format:'- %s (%h)' -n 20 "$current_tag" > "$changelog_path"
          fi

          if [[ ! -s "$changelog_path" ]]; then
            echo "- Maintenance release." > "$changelog_path"
          fi

          echo "Mosapi changelog:"
          cat "$changelog_path"
          
          # Ensure the changelog ends with a newline and use a clean EOF
          {
            echo "changelog<<EOF"
            sed -e '$a\' "$changelog_path"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Android release to Mosapi CMS
        env:
          MOSAPI_TOKEN: ${{ secrets.MOSAPI_TOKEN }}
          MOSAPI_FOLDER_ID: ${{ env.MOSAPI_FOLDER_ID }}
          MOSAPI_PRODUCT_ID: ${{ env.MOSAPI_PRODUCT_ID }}
          MOSAPI_PRODUCT_SLUG: ${{ env.MOSAPI_PRODUCT_SLUG }}
          MOSAPI_VERSION: ${{ steps.get_version.outputs.version_name }}
          MOSAPI_CHANGELOG: ${{ steps.generate_changelog.outputs.changelog }}
          MOSAPI_PROJECT_NAME: NearCast-Android-TX
          WECOM_ROBOTS_KEY: ${{ secrets.WECOM_ROBOTS_KEY }}
        run: node scripts/upload-android-release-to-mosapi.mjs "${{ steps.locate_apk.outputs.apk_path }}"
