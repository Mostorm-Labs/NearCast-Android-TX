name: Mosapi Update Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe update payload variants
        env:
          MOSAPI_TOKEN: ${{ secrets.MOSAPI_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://mosapi-admin.auditoryworks.co/v1/updates';
          const token = process.env.MOSAPI_TOKEN;
          const fileId = 18095;
          const fileMd5 = '19af620fbda9476002871731c6ec5d90';
          const runId = process.env.GITHUB_RUN_ID;

          const variants = [
            {
              name: 'connect-full',
              products: { disconnect: [], connect: [{ id: 627, position: { end: true } }] },
              descriptions: [
                { locale: 'en-us', content: 'probe' },
                { locale: 'zh-cn', content: 'probe' },
              ],
              imgFiles: [],
              extFiles: [],
            },
            {
              name: 'connect-minimal',
              products: { disconnect: [], connect: [{ id: 627, position: { end: true } }] },
            },
            {
              name: 'array-full',
              products: [627],
              descriptions: [
                { locale: 'en-us', content: 'probe' },
                { locale: 'zh-cn', content: 'probe' },
              ],
              imgFiles: [],
              extFiles: [],
            },
            {
              name: 'array-minimal',
              products: [627],
            },
            {
              name: 'connect-no-files',
              products: { disconnect: [], connect: [{ id: 627, position: { end: true } }] },
            },
            {
              name: 'array-no-files',
              products: [627],
            },
            {
              name: 'no-product-no-files',
            },
            {
              name: 'known-windows-product-no-files',
              products: { disconnect: [], connect: [{ id: 626, position: { end: true } }] },
            },
            {
              name: 'known-windows-product-full',
              version: 'v9.9.9',
              products: { disconnect: [], connect: [{ id: 626, position: { end: true } }] },
              fileId: 18074,
              fileMd5: '9ef8d8978f09f66103498610e96a687d',
              fileType: 'NearCast-0.1.78-windows-x64.msi',
              descriptions: [
                { locale: 'en-us', content: 'probe' },
                { locale: 'zh-cn', content: 'probe' },
              ],
              imgFiles: [],
              extFiles: [],
            },
          ];

          for (const [index, variant] of variants.entries()) {
            const version = variant.version ?? `9.9.${index + 1}`;
            const payload = {
              slug: `nearcast-tx-android-${version}`,
              version,
              date: new Date().toISOString(),
              state: 'alpha',
              type: 'optional',
              ...(variant.products ? { products: variant.products } : {}),
              ...(variant.name.includes('no-files') ? {} : {
                otaFiles: [{ type: variant.fileType ?? '1', file: { id: variant.fileId ?? fileId }, md5: variant.fileMd5 ?? fileMd5 }],
              }),
              ...(variant.descriptions ? { descriptions: variant.descriptions } : {}),
              ...(variant.imgFiles ? { imgFiles: variant.imgFiles } : {}),
              ...(variant.extFiles ? { extFiles: variant.extFiles } : {}),
            };

            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: payload }),
            });
            const body = await response.text();
            let parsed;
            try { parsed = JSON.parse(body); } catch { parsed = body; }
            const id = parsed?.data?.id;
            console.log(`${variant.name}: HTTP ${response.status} ${body.slice(0, 500)}`);

            if (id) {
              const deleteResponse = await fetch(`${endpoint}/${id}`, {
                method: 'DELETE',
                headers: { Authorization: token },
              });
              console.log(`${variant.name}: cleanup HTTP ${deleteResponse.status}`);
            }
          }
          NODE
