<!doctype html><meta charset="utf-8"><title>NearCast device test peer</title>
<video autoplay muted playsinline style="max-height:80vh"></video><pre id="status"></pre>
<script>
const FINGERPRINT='__NEARCAST_CONTRACT_FINGERPRINT__';
const target={sessionId:'owned-capture-test',sessionGeneration:'1',slotId:'0',bindingGeneration:'1',lifecycleGeneration:'1'};
const runtimeInstanceId='android-device-test-rx';
const strictSource=new URLSearchParams(location.search).has('webcast');
const pc=new RTCPeerConnection(), ws=new WebSocket('ws://127.0.0.1:18888'+(strictSource?'/?role=receiver':''));
let sourceInfo, shareInfo, consentRequest, consentSource;
const log=[], pending=new Map(), fragments=new Map();
let dc,sid='',source=null,stream=null,seq=0,cursor=0n,msg=0,rpcId=0,opening=null,receivedFrames=0;
let remoteDescriptionReady=false,ice=[],heartbeat;
const video=document.querySelector('video');
function record(type,data){log.push({at:performance.now(),type,...data});if(log.length>250)log.shift();document.querySelector('#status').textContent=JSON.stringify(log.slice(-8),null,2);}
function crc(bytes){let n=65535;for(const b of bytes){n^=b<<8;for(let i=0;i<8;i++)n=((n&32768)?(n<<1)^0x1021:n<<1)&65535;}return n;}
function frame(type,payload){const b=new Uint8Array(payload.length+14),v=new DataView(b.buffer);b.set([65,88,1,type]);v.setUint16(4,payload.length);v.setUint16(8,++msg&65535);b[11]=1;b.set(payload,12);v.setUint16(b.length-2,crc(b.subarray(0,-2)));return b;}
function control(op){dc.send(frame(1,new Uint8Array([op,0,1,0,0])));}
function openSession(){sid='';source=null;stream=null;opening=null;seq=0;cursor=0n;
 dc.send(new Uint8Array([65,88,1,1,0,22,0,0,0,1,0,1,1,0,1,0,0,4,2,16,0,7,1,7,8,1,1,10,2,3,232,11,1,0,52,242]));}
function rpc(op,d){const json=new TextEncoder().encode(JSON.stringify({sid,op,d}));dc.send(frame(2,new Uint8Array([1,...json])));}
function request(method,params){const id=++rpcId;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});rpc(7,{id,method,params});setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('RPC timeout '+method));}},5000);});}
function binding(){return{controlVersion:1,streamKind:'touchback',runtimeInstanceId,target};}
async function openInput(){
 if(strictSource){
  if(sourceInfo?.platform!=='android'||sourceInfo?.clientKind!=='mobile'||sourceInfo?.product!=='nearhub-cast'||sourceInfo?.displaySurface!=='monitor'||!source?.available)return;
  if(consentSource!==source.sourceBindingId){consentSource=source.sourceBindingId;consentRequest=crypto.randomUUID();productTarget({requestId:consentRequest,timeoutMs:8000,cancel:false});return;}
  if(source.controlConsent?.requestId!==consentRequest||source.controlConsent.status!=='accepted')return;
  if(typeof source.geometryRevision!=='string')throw new Error('RX requires a string geometry revision');
 }
 if(!sid||!source?.available||opening===source.sourceBindingId||stream?.sourceBindingId===source.sourceBindingId)return;
 const id=source.sourceBindingId;opening=id;
 try{const result=await request('input.openStream',{...binding(),sourceBindingId:id,format:'input-sample-v1',inputTypes:['touch','mouse'],maxDataBytes:4096,touch:{maxContacts:10},mouse:{buttonsMask:1,modifierMask:0,allowChords:false,wheelUnits:['detent120'],continuousScroll:false},commandId:crypto.randomUUID()});
 if(source?.sourceBindingId===id&&source.available){stream={...result,sourceBindingId:id};seq=0;cursor=0n;record('opened',{streamId:stream.streamId});}}
 catch(error){record('open-error',{error:error.message});}finally{if(opening===id)opening=null;}
}
function productTarget(controlRequest){dc.send(JSON.stringify({action:'nearcast-input-target',data:{version:1,contractFingerprint:FINGERPRINT,runtimeInstanceId,target,...(controlRequest?{controlRequest}:{})}}));}
function decodeFrame(bytes){
 const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 if(bytes.length<14||bytes[0]!==65||bytes[1]!==88||v.getUint16(4)+14!==bytes.length||v.getUint16(bytes.length-2)!==crc(bytes.subarray(0,-2)))throw new Error('Bad TX frame');
 let payload=bytes.slice(12,-2);const count=bytes[11];
 if(count>1){const key=[bytes[3],bytes[6],bytes[7],v.getUint16(8)].join(':');let set=fragments.get(key);if(!set){set=new Map();fragments.set(key,set);}set.set(bytes[10],payload);if(set.size!==count)return;payload=new Uint8Array([...Array(count).keys()].flatMap(i=>[...set.get(i)]));fragments.delete(key);}
 if(bytes[3]===1){record('control',{op:payload[0]});return;}
 if(bytes[3]!==2||payload[0]!==1)throw new Error('Unexpected TX payload');
 const body=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(payload.slice(1)));
 if(body.op===0){rpc(2,{randomSeed:123,eventMasks:'050101'});return;}
 if(body.op===3){sid=body.sid;record('ready',{sid});productTarget();openInput();return;}
 if(body.op===7&&body.d.method==='cast.getTouchbackState'){
  const params=body.d.params??{},got=params.target;
  const valid=got&&Object.keys(params).length===1&&Object.keys(got).length===Object.keys(target).length&&Object.keys(target).every(key=>got[key]===target[key]);
  rpc(8,{id:body.d.id,status:{ok:Boolean(valid),code:valid?0:10},...(valid?{result:{target,receiverOptIn:true,controllerRequested:true,effectiveEnabled:Boolean(stream&&source?.available),lifecycleState:stream?'active':'opening',diagnosticReason:stream?'ACTIVE':'WAITING_FOR_INPUT_CONTEXT'}}:{})});return;
 }
 if(body.op===8){const item=pending.get(body.d.id);if(item){pending.delete(body.d.id);if(body.d.status.ok)item.resolve(body.d.result);else item.reject(new Error(JSON.stringify(body.d.status)));}return;}
 if(body.op===6)record('event',body.d);
}
async function signal(type,payload){
 if(type==='offer'){await pc.setRemoteDescription({type:'offer',sdp:payload.sdp});remoteDescriptionReady=true;for(const c of ice.splice(0))await pc.addIceCandidate(c);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sendSignal('answer',{type:'answer',sdp:answer.sdp});}
 else if(type==='ice'||type==='ice-candidate'){const c=typeof payload.candidate==='object'?payload.candidate:{candidate:payload.candidate,sdpMid:payload.sdpMid,sdpMLineIndex:payload.sdpMLineIndex};if(remoteDescriptionReady)await pc.addIceCandidate(c);else ice.push(c);}
}
function sendSignal(type,payload){if(dc?.readyState==='open')dc.send(JSON.stringify({action:'webrtc-signal',data:{type,payload}}));else ws.send(JSON.stringify({type,...payload}));}
ws.onmessage=event=>{const m=JSON.parse(event.data);signal(m.type,m).catch(error=>record('signal-error',{error:error.message}));};
pc.onicecandidate=event=>{if(event.candidate)sendSignal('ice-candidate',{candidate:event.candidate.toJSON()});};
pc.onconnectionstatechange=()=>record('peer',{state:pc.connectionState});
pc.ontrack=event=>{video.srcObject=event.streams[0]??new MediaStream([event.track]);record('track',{kind:event.track.kind,id:event.track.id});};
if(video.requestVideoFrameCallback){const callback=()=>{receivedFrames++;video.requestVideoFrameCallback(callback);};video.requestVideoFrameCallback(callback);}
pc.ondatachannel=event=>{
 dc=event.channel;dc.binaryType='arraybuffer';
 dc.onopen=()=>{
  openSession();
  heartbeat=setInterval(()=>{if(dc.readyState==='open')control(4);},1000);record('channel',{state:'open'});
 };
 dc.onclose=()=>{clearInterval(heartbeat);record('channel',{state:'closed'});};
 dc.onmessage=async event=>{try{
  if(typeof event.data!=='string'){decodeFrame(new Uint8Array(event.data));return;}
  const m=JSON.parse(event.data);
  if(m.action==='webrtc-signal')await signal(m.data.type,m.data.payload??m.data);
  if(m.action==='nearcast-source'||m.action==='nearcast-share-state'){
   if(Object.keys(m.data).length!==6||m.data.version!==1||m.data.roomId!=='local-room'||m.data.senderUserId!=='local-sender'||m.data.receiverUserId!=='local-host'||typeof m.data.revision!=='string')throw new Error('RX metadata context mismatch');
   if(m.action==='nearcast-source'){sourceInfo=m.data.source;record('source-info',sourceInfo);await openInput();}
   else {shareInfo=m.data;record('share-state',{sharing:shareInfo.sharing});}
  }
  if(m.action==='nearcast-input-source'){
   if(m.data.contractFingerprint!==FINGERPRINT||m.data.roomId!=='local-room'||m.data.senderUserId!=='local-sender'||m.data.receiverUserId!=='local-host')throw new Error('Product association mismatch');
   source=m.data;if(!source.available)stream=null;record('source',{available:source.available,reason:source.disabledReason,sourceBindingId:source.sourceBindingId});await openInput();
  }
 }catch(error){record('receive-error',{error:error.message});}};
};
function input(data){if(!stream)throw new Error('No input stream');const b=new Uint8Array(16+data.length),v=new DataView(b.buffer);v.setUint32(0,stream.streamId);v.setUint32(4,++seq);v.setBigUint64(8,cursor+=1000n);b.set(data,16);dc.send(frame(3,b));return seq;}
function touch(records){const b=new Uint8Array(1+records.length*7),v=new DataView(b.buffer);b[0]=1;records.forEach((r,i)=>{const p=1+i*7;v.setUint16(p,r.id);b[p+2]=r.phase;v.setUint16(p+3,r.x);v.setUint16(p+5,r.y);});return input(b);}
function mouse(kind,buttons=0,x=32768,y=44000,wheelX=0,wheelY=0){const b=new Uint8Array(kind===2?22:12),v=new DataView(b.buffer);b[0]=2;b[1]=kind;v.setUint32(4,buttons);v.setUint16(8,x);v.setUint16(10,y);if(kind===2){v.setInt32(14,wheelX);v.setInt32(18,wheelY);}return input(b);}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function waitSubmitted(want){const id=stream?.streamId;for(let i=0;i<80;i++){const state=await request('stream.getState',{streamId:id});if(state.lastSeqId>=want)return state;await sleep(25);}throw new Error('Native submission did not complete');}
window.peer={
 snapshot:async()=>{const stats=[];for(const s of (await pc.getStats()).values())if(s.type==='inbound-rtp')stats.push({kind:s.kind,framesDecoded:s.framesDecoded,bytesReceived:s.bytesReceived,totalAudioEnergy:s.totalAudioEnergy});return{peer:pc.connectionState,channel:dc?.readyState,sid,sourceInfo,shareInfo,source,stream,seq,receivedFrames,video:{width:video.videoWidth,height:video.videoHeight,tracks:video.srcObject?.getTracks().map(t=>({kind:t.kind,id:t.id,readyState:t.readyState}))},stats,log};},
 command:async({action})=>{
  if(action==='tap'){touch([{id:1,phase:0,x:22000,y:44000}]);await sleep(70);touch([{id:1,phase:2,x:22000,y:44000}]);}
  else if(action==='drag'){touch([{id:1,phase:0,x:18000,y:42000}]);await sleep(350);for(let i=1;i<=8;i++){touch([{id:1,phase:1,x:18000+i*3000,y:42000}]);await sleep(40);}touch([{id:1,phase:2,x:42000,y:42000}]);}
  else if(action==='pinch'){touch([{id:1,phase:0,x:26000,y:44000}]);await sleep(50);touch([{id:1,phase:1,x:26000,y:44000},{id:2,phase:0,x:38000,y:44000}]);for(let i=1;i<=5;i++){await sleep(50);touch([{id:1,phase:1,x:26000-i*1500,y:44000},{id:2,phase:1,x:38000+i*1500,y:44000}]);}touch([{id:1,phase:2,x:18500,y:44000},{id:2,phase:1,x:45500,y:44000}]);await sleep(30);touch([{id:2,phase:2,x:45500,y:44000}]);}
  else if(action==='mouse'){mouse(0);mouse(1,1);await sleep(80);mouse(0,1,38000);await sleep(50);mouse(1,0,38000);await sleep(100);mouse(2,0,32768,44000,0,120);}
  else if(action==='hold'){touch([{id:1,phase:0,x:28000,y:44000}]);}
  else if(action==='badCrc'){const b=frame(3,new Uint8Array(24));b[b.length-1]^=1;dc.send(b);return{sent:true};}
  else if(action==='resetInput'){openSession();return{sent:true};}
  else if(action==='disconnect'){dc.close();return{closed:true};}
  else if(action==='close'){return request('input.closeStream',{...binding(),streamId:stream.streamId,commandId:crypto.randomUUID()});}
  else throw new Error('Unknown command');
  return waitSubmitted(seq);
 }
};
</script>
